name: Deploy to GitHub Pages

on:
  push:
    branches: ["Alien-Wrangler-Main", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Write build version
        run: |
          cat > version.json <<EOF
          {"sha":"$(git rev-parse --short HEAD)","branch":"${GITHUB_REF_NAME}","built":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          cat version.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
