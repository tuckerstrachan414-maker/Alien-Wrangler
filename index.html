<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c14">
<title>Alien Wrangler</title>
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="build-version"></div>
  <canvas id="game"></canvas>

  <!-- In-game HUD (top) -->
  <div id="hud" class="hidden">
    <div id="hud-top">
      <button class="hud-pill hud-btn" id="btn-pause" aria-label="Pause"><span class="pause-glyph"></span></button>
      <div class="hud-pill" id="hud-timer">
        <span class="hud-ico" id="ico-ufo"></span><span id="timer-text">2:30</span>
      </div>
      <div class="hud-pill" id="hud-score">
        <span class="hud-ico" id="ico-alien"></span><span id="score-text">0/5</span>
      </div>
      <div class="hud-pill hidden" id="hud-sprint">SPRINT</div>
      <div class="hud-pill" id="hud-cash"><span class="hud-ico" id="ico-coin"></span><span id="cash-text">0</span></div>
    </div>
    <div id="hud-warning" class="hidden">UFO INBOUND</div>
    <div id="stamina-wrap"><div id="stamina-bar"></div></div>
  </div>

  <!-- Touch controls -->
  <div id="controls" class="hidden">
    <!-- Left half = legs: drag to walk, push out past the sprint ring to sprint -->
    <div id="joy-zone">
      <div id="joy-base" class="hidden"><div id="joy-edge"></div><div id="joy-knob"></div></div>
    </div>
    <!-- Right half = hands: tap gadget 1, swipe up jump / down dive / left dash / right gadget 2.
         Only live in no-buttons mode. -->
    <div id="act-zone"></div>
    <div id="gesture-hints">
      <div class="ghint-col">
        <div class="ghint">DRAG <b>MOVE</b></div>
        <div class="ghint" id="hint-sprint">PUSH FAR <b>SPRINT</b></div>
      </div>
      <!-- laid out as a cross so each label sits the way you swipe for it -->
      <div class="ghint-cross">
        <div class="ghint" id="hint-jump"><i class="arr up"></i><b>JUMP</b></div>
        <div class="ghint" id="hint-dash"><i class="arr lt"></i><b>DASH</b></div>
        <div class="ghint" id="hint-g1">2xTAP<b>GRAB</b></div>
        <div class="ghint" id="hint-g2"><i class="arr rt"></i><b>-</b></div>
        <div class="ghint" id="hint-dive"><i class="arr dn"></i><b>DIVE</b></div>
      </div>
    </div>
    <div id="btn-zone">
      <button class="act-btn" id="btn-grab">GRAB</button>
      <button class="act-btn" id="btn-dive">DIVE</button>
      <button class="act-btn" id="btn-dash">DASH</button>
      <button class="act-btn" id="btn-jump">JUMP</button>
      <button class="act-btn toggle" id="btn-sprint">SPRINT</button>
      <!-- gadget slots 1 + 2, labelled for whatever is equipped -->
      <button class="act-btn gadget-btn hidden" id="btn-g1"></button>
      <button class="act-btn gadget-btn hidden" id="btn-g2"></button>
    </div>
  </div>

  <!-- Menu overlay screens are built by ui.js into this root -->
  <div id="ui-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
